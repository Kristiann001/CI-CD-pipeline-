---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: >-
    This task will clean up a workspace by deleting all of the files.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      command: ["/bin/sh", "-c"]
      args:
        - |-
          set -eu
          echo "Removing all files from workspace..."
          if [ -d "$WORKSPACE_SOURCE_PATH" ] ; then
            # Delete non-hidden files and directories
            rm -rf "$WORKSPACE_SOURCE_PATH"/*
            # Delete files and directories starting with . but excluding ..
            rm -rf "$WORKSPACE_SOURCE_PATH"/.[!.]*
            # Delete files and directories starting with .. plus any other character
            rm -rf "$WORKSPACE_SOURCE_PATH"/..?*
          fi
          echo "All files deleted from workspace path: $WORKSPACE_SOURCE_PATH"

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: >-
    This task will run nosetests on the provided application with nose,
    spec, and coverage plugins.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to nose
      type: string
      default: "-v --with-spec --spec-color --with-coverage --cover-package=app"
    - name: database_uri
      description: Database connection string
      type: string
      default: "sqlite:///test.db"
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: $(params.database_uri)
      command: ["/bin/bash", "-c"]
      args:
        - |-
          pip install --upgrade pip && \
          pip install -qr requirements.txt && \
          nosetests $(params.args)
